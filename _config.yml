title: Fresh Pops
description: >-
  Fresh Pops is a music-first neighborhood bar at 564 DeKalb Ave in Bed-Stuy, Brooklyn,
  built around drinks, food, and live music. We are not open yet.
  Join the email list for real opening updates.
url: "https://freshpops.nyc"
baseurl: ""
lang: en-US
timezone: America/New_York
instagram_url: "https://instagram.com/freshpopsnyc"
contact_email: "info@freshpops.nyc"
mailerlite_account: "2108060"
mailerlite_form_id: "C0eoW1"
social_image: "/assets/brand/social-card.png"
logo_path: "/assets/brand/logo-horizontal.svg"

markdown: kramdown
permalink: pretty

collections:
  updates:
    output: true
    permalink: /updates/:slug/

defaults:
  - scope:
      path: ""
      type: updates
    values:
      layout: update
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - assets/Fresh Pops Final Files
  - README.md
  - script.js
  - styles.css
