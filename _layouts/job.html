---
layout: default
---
<main id="main" class="careers-main">
  <article class="container job-article">
    <p class="job-back"><a href="{{ '/careers/' | relative_url }}">&larr; All positions</a></p>
    <header class="job-header">
      <p class="career-status">Now accepting applications</p>
      <h1>{{ page.title }}</h1>
      <p class="career-meta">Bed-Stuy, Brooklyn · Paid consulting/opening engagement</p>
      <p class="job-pay">$40–$60/hour, depending on experience</p>
      <a class="btn btn-primary" href="#how-to-apply">How to apply</a>
    </header>
    <div class="job-content">
      {{ content }}
    </div>
  </article>
</main>
