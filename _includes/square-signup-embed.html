{% comment %}
Archived Square signup form.

Keep this as a reference for switching back after Fresh Pops upgrades to
Square Plus. To reactivate it, update the homepage signup include back to this
file and restore `square_signup_url` as the live fallback URL.
{% endcomment %}
<form action="https://squareup.com/outreach/viBFAc/subscribe" method="POST" target="_blank">
  <input
    type="email"
    name="email_address"
    placeholder="Your Email Address"
    required
  />
  <input type="hidden" name="embed" value="true" />
  <button type="submit">Join Now</button>
</form>
