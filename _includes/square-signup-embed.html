{% comment %}
Paste Square's Embedded Sign-up Form HTML here when it is available from:
Customers > Customer Directory > Settings > Email Collection > Embedded Sign-up Form.
{% endcomment %}
<form action="https://squareup.com/outreach/viBFAc/subscribe" method="POST" target="_blank">
  <input
    type="email"
    name="email_address"
    placeholder="Your Email Address"
    required
  />
  <input type="hidden" name="embed" value="true" />
  <button type="submit">Join Now</button>
</form>
